<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>joel</title>
    <meta name="color-scheme" content="dark light">
    <style>
      html,body,#root { height: 100%; margin: 0; background:#0b0b0b; }

      /* Button reset and accessible focus */
      button { -webkit-appearance:none; appearance:none; border:0; background:transparent; color:inherit; font:inherit; }
      button:focus { outline:none; }
      button:focus-visible { outline:2px solid #2a2a2a; outline-offset:2px; border-radius:8px; }
      button::-moz-focus-inner { border:0; }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-presets="react">
      function App() {
        const [route, setRoute] = React.useState("home");
        const [reader, setReader] = React.useState(null);

        const content = {
          series: [
            {
              title: 'Reihe Geld',
              blurb: 'does money matter, or do real goods drive outcomes?',
              parts: [
                { t: 'Über die Makute', d: '2025-06-01', s: 'Montesquieu, gedachte Einheiten, Fama, Modigliani–Miller.' },
                { t: 'Kann Free Banking funktionieren?', d: '2025-06-15', s: 'Praktikabilität, Stabilität, Clearing.' },
                { t: 'Was ist Geld?', d: '2025-07-01', s: 'Mehrere Linsen; Cochrane; wann sind Krypto-Assets Geld?' },
                { t: 'Cryptowährungen', d: '2025-07-20', s: 'Design, Geldähnlichkeit, Friktionen.' }
              ]
            },
            {
              title: 'Reihe Eigentum',
              blurb: 'Eigentum als Fundament: Rechtfertigung, Grenzen, Enteignung.',
              parts: [
                { t: 'Rechtfertigung und Ursprung', d: '2025-08-05', s: 'Locke vs Hume; Naturrecht vs Konvention.' },
                { t: 'Grenzen, Enteignung, Ausschließbarkeit', d: '2025-08-19', s: 'Temporale & Spezies-Ungerechtigkeiten; Trespassing.' },
                { t: 'Wem gehört der Mond?', d: '2025-09-02', s: 'Anspruch, Durchsetzung, Legitimität in neuen Räumen.' }
              ]
            }
          ],
          singles: [
            { t: 'Langfristige Investition, Wachstum & Erhaltung', d: '2025-05-10', s: 'Infrastruktur, Wartung, Kapitalstock.' }
          ]
        };

        const openReader = (payload) => {
          if (payload && payload.type === 'series') {
            const s = content.series[payload.seriesIndex];
            if (!s) return;
            const p = s.parts[payload.partIndex];
            if (!p) return;
            setReader({
              type: 'series',
              series: s.title,
              seriesIndex: payload.seriesIndex,
              partIndex: payload.partIndex,
              title: p.t,
              date: p.d,
              blurb: p.s
            });
            return;
          }
          if (payload && payload.type === 'single') {
            const p = content.singles[payload.index];
            if (!p) return;
            setReader({ type: 'single', index: payload.index, title: p.t, date: p.d, blurb: p.s });
            return;
          }
          if (payload && payload.title) {
            setReader(payload);
          }
        };

        return (
          <div style={{ minHeight: "100vh", background: "#0b0b0b", color: "#e5e5e5", fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif" }}>
            <style>{`
              a { color: inherit; }
              .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
              .nav { position: sticky; top: 0; background: rgba(0,0,0,0.75); backdrop-filter: saturate(1.2) blur(6px); border-bottom: none; z-index: 10; }
              .nav-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; }
              .title { font-weight: 700; letter-spacing: -0.02em; }
              .title.joel { position: relative; display: inline-flex; align-items: flex-end; gap: 0; color: #e5e5e5; line-height: 1; letter-spacing: -0.02em; }
              .j-pad { display:inline-block; width:0.12em; }
              .logo { display:inline-flex; align-items:flex-end; margin-right:-0.30em; transform: translateY(0.20em); }
              .logo svg { height:1.05em; width:auto; display:block; overflow:visible; }
              .logo-oel { display:inline-block; margin-left:-0.26em; }
              .logo-dot { transition: transform .25s cubic-bezier(.2,.7,.2,1.2); transform-origin:center; }
              .title.joel:hover .logo-dot { transform: translateY(-15%); }
              .tabs { display: flex; gap: 16px; }
              .tab { padding: 8px 0; border: none; border-radius: 0; background: transparent; color: #bbb; font-size: 13px; cursor: pointer; }
              .tab:hover { color: #fff; }
              .tab.active { color: #fff; }
              .main { padding-top: 28px; padding-bottom: 40px; }
              h1 { font-size: 52px; line-height: 1.05; margin: 0 0 12px 0; letter-spacing: -0.02em; }
              h2 { font-size: 28px; margin: 0 0 12px 0; }
              p { margin: 12px 0; color: #c9c9c9; }
              .dim { color: #9ca3af; }
              .list { display: grid; gap: 12px; }
              .card { border: 1px solid #1f1f1f; border-radius: 12px; padding: 14px 16px; background: #0f0f0f; }
              .link { text-decoration: underline; text-underline-offset: 3px; }
              .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em }
              .slider { -webkit-appearance: none; appearance: none; height: 2px; width: 220px; background: #1f1f1f; border-radius: 2px; outline: none; }
              .slider:hover { background: #262626; }
              .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #8a8a8a; border: 1px solid #2a2a2a; box-shadow: none; transition: background .2s, transform .1s; }
              .slider:hover::-webkit-slider-thumb { background: #bdbdbd; }
              .slider:active::-webkit-slider-thumb { transform: scale(1.05); }
              .slider::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: #8a8a8a; border: 1px solid #2a2a2a; }
              .slider::-ms-thumb { width: 12px; height: 12px; border-radius: 50%; background: #8a8a8a; border: 1px solid #2a2a2a; }
              footer{
  border-top:1px solid #1f1f1f;              /* softer line on dark bg */
  padding:20px 0 calc(56px + env(safe-area-inset-bottom)); /* more breathing room incl. iOS safe area */
  margin-top:40px;                            /* more gap above footer */
  color:#9ca3af;                              /* dimmer text */
  font-size:13px;
} }
            `}</style>

            <div className="nav">
              <div className="wrap nav-inner">
                <div className="title joel" aria-label="joel">
                  <span className="j-pad" aria-hidden="true">&nbsp;</span>
                  <span className="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" aria-label="j">
                      <circle className="logo-dot" cx="9.2" cy="1" r="2.1" fill="currentColor" />
                      <path d="M9.2 7.0 V14.2 Q8.4 18.8 6.8 18.8" fill="none" stroke="currentColor" strokeWidth="3.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </span><span className="logo-oel">oel</span>
                </div>
                <div className="tabs">
                  <button className={`tab ${route==='home'?'active':''}`} onClick={()=> setRoute('home')}>home</button>
                  <button className={`tab ${route==='reading'?'active':''}`} onClick={()=> setRoute('reading')}>reading</button>
                  <button className={`tab ${route==='writings'?'active':''}`} onClick={()=> setRoute('writings')}>writings</button>
                  <button className={`tab ${route==='about'?'active':''}`} onClick={()=> setRoute('about')}>about</button>
                </div>
              </div>
            </div>

            {route === 'home' && <Home />}
            {route === 'reading' && <Reading />}
            {route === 'writings' && (reader ? <ReaderView data={reader} content={content} onClose={()=>setReader(null)} onOpen={openReader} /> : <Writings onOpen={openReader} content={content} />)}
            {route === 'about' && <About />}

            <footer className="wrap">© {new Date().getFullYear()} joel — site is a work in progress :)</footer>
          </div>
        );
      }

      function Home(){
        return (
          <>
            <main className="wrap main">
              <h1>hi.</h1>
              <p>i'm joel.</p>
              <p>i study law & economics (and a little philosophy).</p>
              <p>during my undergrad, i focused on efficient markets, corporate law, and the philosophical foundations of legal entities (ltd, gmbh).</p>
              <p>here, i explore ideas in different fields and share what interests me.</p>
              <p className="dim">you can find me on <a className="link" href="https://x.com/foenus" target="_blank" rel="noreferrer">x</a>.</p>
              <Note>note: this site is new. i'll keep adding little essays and project notes.</Note>
              <div style={{marginTop:28}}></div>
            </main>
            <LandTaxChartDemo />
          </>
        );
      }

      function Reading(){
        const themes = [
          'efficient markets',
          'taxation of land values',
          'definitions of property rights',
          'institutional design',
          'coordination & signals'
        ];
        const people = ['ronald coase', 'eugene fama', 'elinor ostrom', 'james buchanan'];
        const placeholders = [
          { k: 'paper', hint: 'add title • author • year • one-line idea' },
          { k: 'paper', hint: 'add title • author • year • one-line idea' },
          { k: 'paper', hint: 'add title • author • year • one-line idea' }
        ];
        return (
          <main className="wrap main">
            <h2>reading</h2>
            <p className="dim">a shelf to store ideas worth exploring.</p>
            <div className="list" style={{marginTop:12}}>
              <div className="card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                  <div style={{fontWeight:600}}>papers</div>
                  <div className="mono dim" style={{fontSize:12}}>muster</div>
                </div>
                <div className="list" style={{marginTop:8}}>
                  {placeholders.map((ph,i)=> (
                    <div key={i} style={{border:'1px dashed #2a2a2a',borderRadius:10,padding:'10px 12px',background:'#0b0b0b'}}>
                      <div style={{display:'flex',justifyContent:'space-between',gap:8}}>
                        <span style={{opacity:.9}}>add paper #{i+1}</span>
                        <span className="mono dim" style={{fontSize:12}}>{ph.hint}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
              <div className="card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                  <div style={{fontWeight:600}}>themes</div>
                  <div className="mono dim" style={{fontSize:12}}>edit later</div>
                </div>
                <div style={{display:'flex',flexWrap:'wrap',gap:8,marginTop:8}}>
                  {themes.map((t,i)=> (
                    <span key={i} className="mono" style={{fontSize:12,padding:'6px 8px',border:'1px solid #1f1f1f',borderRadius:8,background:'#0b0b0b'}}>{t}</span>
                  ))}
                </div>
              </div>
              <div className="card">
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                  <div style={{fontWeight:600}}>people</div>
                  <div className="mono dim" style={{fontSize:12}}>examples</div>
                </div>
                <div className="list" style={{marginTop:8}}>
                  {people.map((n,i)=> (
                    <div key={i} style={{display:'flex',justifyContent:'space-between',gap:8}}>
                      <span>{n}</span>
                      <span className="dim" style={{fontSize:13}}>add why relevant</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </main>
        );
      }

      function Writings({ onOpen, content }){
        const [openSeries, setOpenSeries] = React.useState({});
        const [showIndex, setShowIndex] = React.useState(false);
        const toggleSeries = (i) => setOpenSeries(prev => ({ ...prev, [i]: !prev[i] }));

        const { series, singles } = content;

        const allItems = React.useMemo(() => {
          const items = [];
          series.forEach((s, si) => {
            s.parts.forEach((p, pi) => {
              items.push({ kind:'series', seriesIndex: si, partIndex: pi, title: p.t, date: p.d, seriesTitle: s.title });
            });
          });
          singles.forEach((p, i) => items.push({ kind:'single', index: i, title: p.t, date: p.d, seriesTitle: 'single' }));
          return items.sort((a,b)=> new Date(b.date) - new Date(a.date));
        }, [series, singles]);

        const Chevron = ({open}) => (
          <svg width="16" height="16" viewBox="0 0 24 24" style={{transform: open?'rotate(90deg)':'rotate(0deg)', transition:'transform .15s ease'}} aria-hidden="true"><path d="M8 5l8 7-8 7" fill="none" stroke="#9ca3af" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        );

        const Stats = () => {
          const total = allItems.length;
          const last = allItems[0]?.date || '—';
          const byYear = allItems.reduce((acc,it)=>{ const y = (it.date||'').slice(0,4); acc[y]=(acc[y]||0)+1; return acc; },{});
          const currentYear = new Date().getFullYear().toString();
          return (
            <div style={{display:'flex',gap:12,alignItems:'baseline',flexWrap:'wrap'}}>
              <span className="mono dim" style={{fontSize:12}}>total: {total}</span>
              <span className="mono dim" style={{fontSize:12}}>{currentYear}: {byYear[currentYear] || 0}</span>
              <span className="mono dim" style={{fontSize:12}}>last: {last}</span>
            </div>
          );
        };

        return (
          <main className="wrap main">
            <h2 style={{margin:0}}>writings</h2>
            <div style={{marginTop:8}}><Stats/></div>

            {!showIndex ? (
              <div className="list" style={{marginTop:12}}>
                <div className="card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontWeight:600}}>series</div>
                    <div className="mono dim" style={{fontSize:12}}>muster</div>
                  </div>
                  <div className="list" style={{marginTop:8}}>
                    {series.map((s,i)=> (
                      <div key={i} style={{border:'1px solid #1f1f1f',borderRadius:10,background:'#0f0f0f'}}>
                        <button onClick={()=>toggleSeries(i)} aria-expanded={!!openSeries[i]} style={{width:'100%',textAlign:'left',padding:'12px 12px',background:'transparent',border:'none',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
                          <div>
                            <div style={{fontWeight:600}}>{s.title}</div>
                            <div className="dim" style={{marginTop:4,fontSize:14}}>{s.blurb}</div>
                          </div>
                          <Chevron open={!!openSeries[i]} />
                        </button>
                        {openSeries[i] && (
                          <div className="list" style={{padding:'0 12px 12px 12px'}}>
                            {s.parts.map((p,j)=> (
                              <div key={j} style={{border:'1px solid #1f1f1f',borderRadius:8}}>
                                <button onClick={()=>onOpen({ type: 'series', seriesIndex: i, partIndex: j })} style={{width:'100%',textAlign:'left',padding:'10px 10px',background:'transparent',border:'none',display:'grid',gridTemplateColumns:'auto 1fr auto',columnGap:8,alignItems:'baseline',cursor:'pointer'}}>
                                  <span className="mono dim" style={{fontSize:12,width:20,textAlign:'right'}}>{j+1}.</span>
                                  <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.t}</span>
                                  <span className="mono dim" style={{fontSize:12}}>{p.d}</span>
                                </button>
                                <div className="dim" style={{padding:'0 10px 10px 38px',fontSize:12}}>{p.s}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontWeight:600}}>single essays</div>
                    <div className="mono dim" style={{fontSize:12}}>muster</div>
                  </div>
                  <div className="list" style={{marginTop:8}}>
                    {singles.map((p,i)=> (
                      <div key={i} style={{border:'1px solid #1f1f1f',borderRadius:8}}>
                        <button onClick={()=>onOpen({ type: 'single', index: i })} style={{width:'100%',textAlign:'left',padding:'10px 10px',background:'transparent',border:'none',display:'grid',gridTemplateColumns:'1fr auto',columnGap:8,alignItems:'baseline',cursor:'pointer'}}>
                          <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.t}</span>
                          <span className="mono dim" style={{fontSize:12}}>{p.d}</span>
                        </button>
                        <div className="dim" style={{padding:'0 10px 10px 10px',fontSize:12}}>{p.s}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div className="card" style={{marginTop:12}}>
                <div style={{display:'grid',gridTemplateColumns:'100px 1fr auto',gap:'8px 12px',alignItems:'center'}}>
                  <div className="mono dim" style={{fontSize:12}}>date</div>
                  <div className="mono dim" style={{fontSize:12}}>title</div>
                  <div className="mono dim" style={{fontSize:12,textAlign:'right'}}>type</div>
                  {allItems.map((it,idx)=> (
                    <React.Fragment key={idx}>
                      <div className="mono dim" style={{fontSize:12}}>{it.date}</div>
                      <button onClick={()=> onOpen(it.kind==='series' ? { type:'series', seriesIndex: it.seriesIndex, partIndex: it.partIndex } : { type:'single', index: it.index })} style={{textAlign:'left',background:'transparent',border:'none',padding:'6px 0',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.title}</button>
                      <div className="mono dim" style={{fontSize:12,textAlign:'right'}}>{it.kind==='series' ? it.seriesTitle : 'single'}</div>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            )}

            <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
              <div style={{display:'inline-flex',border:'1px solid #1f1f1f',borderRadius:10,overflow:'hidden'}}>
                <button onClick={()=>setShowIndex(false)} className="mono" style={{fontSize:12,padding:'6px 10px',background: showIndex ? 'transparent' : '#1a1a1a',color:'#cfcfcf',cursor:'pointer'}}>series</button>
                <button onClick={()=>setShowIndex(true)} className="mono" style={{fontSize:12,padding:'6px 10px',background: showIndex ? '#1a1a1a' : 'transparent',color:'#cfcfcf',cursor:'pointer'}}>index</button>
              </div>
            </div>
          </main>
        );
      }

      function ReaderView({ data, content, onOpen, onClose }){
        React.useEffect(()=>{
          const onKey = (e)=>{ if(e.key==='Escape'){ onClose(); }};
          window.addEventListener('keydown', onKey);
          return ()=> window.removeEventListener('keydown', onKey);
        }, [onClose]);

        const nextInfo = React.useMemo(()=>{
          if (data && data.type==='series'){
            const s = content.series[data.seriesIndex];
            if (!s) return null;
            const nextIdx = data.partIndex + 1;
            if (nextIdx < s.parts.length){
              const p = s.parts[nextIdx];
              return { title: p.t, index: nextIdx };
            }
          }
          return null;
        }, [data, content]);

        const goNext = ()=>{
          if (!nextInfo) return;
          onOpen({ type:'series', seriesIndex: data.seriesIndex, partIndex: data.partIndex + 1 });
        };

        return (
          <main className="wrap main">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <button onClick={onClose} className="mono" style={{fontSize:12,padding:'6px 10px',border:'1px solid #1f1f1f',borderRadius:8,background:'transparent',color:'#cfcfcf',cursor:'pointer'}}>← back</button>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <span className="mono dim" style={{fontSize:12}}>{data.series ? data.series : 'essay'}</span>
                {nextInfo && (
                  <button onClick={goNext} className="mono" style={{fontSize:12,padding:'6px 10px',border:'1px solid #1f1f1f',borderRadius:8,background:'transparent',color:'#cfcfcf',cursor:'pointer'}}>next →</button>
                )}
              </div>
            </div>
            <h2 style={{fontSize:34, letterSpacing:'-0.01em', marginTop:12}}>{data.title}</h2>
            <div className="mono dim" style={{fontSize:12, marginTop:4}}>{data.date}</div>
            <article style={{maxWidth:'72ch', marginTop:16, fontSize:18, lineHeight:1.7, color:'#d6d6d6'}}>
              <p className="dim">{data.blurb}</p>
              <p>[draft placeholder] add content here.</p>
            </article>
          </main>
        );
      }

      function About(){
        return (
          <main className="wrap main">
            <h2>about</h2>
            <p>based in europe.</p>
            <p className="dim">reach out on <a className="link" href="https://x.com/foenus" target="_blank" rel="noreferrer">x</a> if you want to exchange ideas.</p>
          </main>
        );
      }

      function Note({ children }){
        return (
          <div className="card" style={{ background: "#121212", borderColor: "#2a2a2a" }}>
            {children}
          </div>
        );
      }

      function LandTaxChartDemo(){
        const [tax, setTax] = React.useState(20);
        const [regime, setRegime] = React.useState('lvt');
        const width = 780, height = 420, pad = 48;
        const a = 100, b = 0.6;
        const Qs = 60;
        const Pb_lvt = a - b*Qs;
        const Ps_lvt = Math.max(0, Pb_lvt - tax);
        const rev_lvt = tax * Qs;
        const c = 10, m = 0.6;
        const Q0 = (a - c) / (b + m);
        const P0 = c + m*Q0;
        const Q1 = Math.max(0, (a - (c + tax)) / (b + m));
        const Pb1 = a - b*Q1;
        const Ps1 = Pb1 - tax;
        const rev_prop = tax * Q1;
        const dwl_val = 0.5 * tax * Math.max(0, (Q0 - Q1));
        const x = (q)=> pad + (q/100)*(width-2*pad);
        const y = (p)=> height - pad - (p/100)*(height-2*pad);

        try {
          if (regime === 'lvt') {
            console.assert(Qs === 60, 'Qs fixed under LVT');
            console.assert(Math.abs(Pb_lvt - (a - b*Qs)) < 1e-9, 'Pb_lvt = a - b*Qs');
            console.assert(Math.abs((Ps_lvt + tax) - Pb_lvt) < 1e-9, 'wedge = tax');
            console.assert(Math.abs(rev_lvt - tax*Qs) < 1e-9, 'rev LVT = t*Q');
          } else {
            console.assert(Q1 <= Q0 + 1e-9, 'Q falls with property tax');
            console.assert(Math.abs((Pb1 - Ps1) - tax) < 1e-9, 'wedge = tax');
            console.assert(Math.abs(rev_prop - tax*Q1) < 1e-9, 'rev prop = t*Q1');
            console.assert(dwl_val >= -1e-9, 'DWL non-negative');
          }
        } catch {}

        return (
          <main className="wrap main">
            <h2>tax regimes in econ 101</h2>
            <p className="dim">lvt: fixed land; no dwl. property tax: q falls; dwl in red.</p>
            <div style={{overflow:'visible'}}>
              <svg width={width} height={height} role="img" aria-label="Tax comparison" style={{display:'block',width:'100%',height:'auto'}}>
                <defs>
                  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L8,4 L0,8 z" fill="#9ca3af" />
                  </marker>
                </defs>
                <line x1={pad} y1={y(0)} x2={pad} y2={y(100)} stroke="#2a2a2a" />
                <line x1={x(0)} y1={height-pad} x2={x(100)} y2={height-pad} stroke="#2a2a2a" />
                <text x={pad-10} y={y(100)-8} fill="#8b8b8b" fontSize="10" textAnchor="end">P</text>
                <text x={x(100)+6} y={height-pad+14} fill="#8b8b8b" fontSize="10">Q</text>

                {regime === 'lvt' ? (
                  <g>
                    <rect x={x(0)} y={y(Pb_lvt)} width={x(Qs)-x(0)-2} height={y(Ps_lvt)-y(Pb_lvt)} fill="#f59e0b" opacity="0.08" />
                    <line x1={x(0)} y1={y(a)} x2={x(100)} y2={y(a - b*100)} stroke="#a6a6a6" strokeWidth="1.6" markerEnd="url(#arrow)" />
                    <text x={x(8)} y={y(a) - 8} fill="#9ca3af" fontSize="10">demand</text>
                    <line x1={x(Qs)} y1={y(0)} x2={x(Qs)} y2={y(100)} stroke="#c7c7c7" strokeWidth="1.6" />
                    <text x={x(Qs)+6} y={y(92)} fill="#9ca3af" fontSize="10">supply (fixed)</text>
                    <circle cx={x(Qs)} cy={y(Pb_lvt)} r="3" fill="#cfcfcf" />
                    <line x1={x(Qs)} y1={y(Ps_lvt)} x2={x(Qs)} y2={y(Pb_lvt)} stroke="#f59e0b" strokeWidth="4" opacity="0.45" />
                    <text x={pad+10} y={y((Pb_lvt+Ps_lvt)/2)+3} fill="#9ca3af" fontSize="10">tax = {tax}</text>
                    <line x1={x(0)} y1={y(Pb_lvt)} x2={x(Qs)} y2={y(Pb_lvt)} stroke="#3a3a3a" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Pb_lvt)+3} fill="#8b8b8b" fontSize="10" textAnchor="end">P_b</text>
                    <line x1={x(0)} y1={y(Ps_lvt)} x2={x(Qs)} y2={y(Ps_lvt)} stroke="#3a3a3a" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Ps_lvt)+3} fill="#8b8b8b" fontSize="10" textAnchor="end">P_s</text>
                    <text x={x(Qs)} y={height-pad+18} fill="#8b8b8b" fontSize="10" textAnchor="middle">Q★</text>
                  </g>
                ) : (
                  <g>
                    <polygon points={`${x(Q1)},${y(Pb1)} ${x(Q1)},${y(c + m*Q1)} ${x(Q0)},${y(P0)}`} fill="#ef4444" opacity="0.12" />
                    <rect x={x(0)} y={y(Pb1)} width={x(Q1)-x(0)-2} height={y(Ps1)-y(Pb1)} fill="#f59e0b" opacity="0.08" />
                    <line x1={x(0)} y1={y(a)} x2={x(100)} y2={y(a - b*100)} stroke="#a6a6a6" strokeWidth="1.6" markerEnd="url(#arrow)" />
                    <text x={x(8)} y={y(a) - 8} fill="#9ca3af" fontSize="10">demand</text>
                    <line x1={x(0)} y1={y(c)} x2={x(100)} y2={y(c + m*100)} stroke="#c7c7c7" strokeWidth="1.6" />
                    <text x={x(6)} y={y(c)+12} fill="#9ca3af" fontSize="10">supply</text>
                    <line x1={x(0)} y1={y(c+tax)} x2={x(100)} y2={y(c + tax + m*100)} stroke="#9ca3af" strokeWidth="1.2" strokeDasharray="6 4" />
                    <text x={x(18)} y={y(c+tax)+12} fill="#9ca3af" fontSize="10">supply + tax</text>
                    <circle cx={x(Q0)} cy={y(P0)} r="3" fill="#cfcfcf" />
                    <circle cx={x(Q1)} cy={y(Pb1)} r="3" fill="#cfcfcf" />
                    <line x1={x(Q1)} y1={y(Ps1)} x2={x(Q1)} y2={y(Pb1)} stroke="#f59e0b" strokeWidth="4" opacity="0.45" />
                    <line x1={x(0)} y1={y(Pb1)} x2={x(Q1)} y2={y(Pb1)} stroke="#3a3a3a" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Pb1)+3} fill="#8b8b8b" fontSize="10" textAnchor="end">P_b</text>
                    <line x1={x(0)} y1={y(Ps1)} x2={x(Q1)} y2={y(Ps1)} stroke="#3a3a3a" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Ps1)+3} fill="#8b8b8b" fontSize="10" textAnchor="end">P_s</text>
                    <text x={(x(Q1)+x(Q1)+x(Q0))/3} y={(y(Pb1)+y(c+m*Q1)+y(P0))/3} fill="#ef4444" fontSize="10" className="mono">DWL</text>
                    <text x={pad+10} y={y((Pb1+Ps1)/2)+3} fill="#9ca3af" fontSize="10">tax = {tax}</text>
                    <text x={x(Q1)} y={height-pad+18} fill="#8b8b8b" fontSize="10" textAnchor="middle">Q_t</text>
                    <text x={x(Q0)} y={height-pad+18} fill="#8b8b8b" fontSize="10" textAnchor="middle">Q₀</text>
                  </g>
                )}
              </svg>
              <div style={{display:'flex',alignItems:'center',gap:12,marginTop:12,flexWrap:'wrap'}}>
                <div style={{display:'inline-flex',border:'1px solid #1f1f1f',borderRadius:10,overflow:'hidden'}}>
                  <button onClick={()=>setRegime('lvt')} className="mono" style={{fontSize:12,padding:'6px 10px',background: regime==='lvt'?'#1a1a1a':'transparent',color:'#cfcfcf',cursor:'pointer',border:'none',outline:'none'}}>LVT</button>
                  <button onClick={()=>setRegime('prop')} className="mono" style={{fontSize:12,padding:'6px 10px',background: regime==='prop'?'#1a1a1a' : 'transparent',color:'#cfcfcf',cursor:'pointer',border:'none',outline:'none'}}>property tax</button>
                </div>
                <span className="mono dim" style={{fontSize:12}}>tax</span>
                <input className="slider" type="range" min={0} max={40} step={2} value={tax} onChange={e=> setTax(parseInt(e.target.value,10))} />
                <span className="mono" style={{opacity:.85}}>{tax}</span>
                {regime==='lvt' ? (
                  <span className="mono dim" style={{fontSize:12}}>· revenue = {Math.round(rev_lvt)}</span>
                ) : (
                  <span className="mono dim" style={{fontSize:12}}>· revenue = {Math.round(rev_prop)} · DWL ≈ {Math.round(dwl_val)}</span>
                )}
                <span className="dim" style={{marginLeft:'auto',fontSize:12}}>{regime==='lvt'?'quantity unchanged; incidence on landowners':'quantity falls; DWL from distorted margin'}</span>
              </div>
            </div>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
