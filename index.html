<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>joel</title>
    <meta name="color-scheme" content="dark light">
    <style>
      html, body { height: 100%; margin: 0; overflow-x: hidden; }
      #root { height: 100%; margin: 0; }
      
      /* Deaktiviert global alle Browser-Fokus-Ränder und Tap-Highlights */
      *, *:focus, *:active, *:focus-visible { 
        outline: none !important; 
        -webkit-tap-highlight-color: transparent; 
      }
    </style>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
      function App() {
        const [route, setRoute] = React.useState("home");
        const [reader, setReader] = React.useState(null);
        const [theme, setTheme] = React.useState('mint');

        React.useEffect(()=>{ document.title = "joel"; }, []);

        const buildHash = (r, rd) => {
          if (r === 'writings' && rd) {
            if (rd.type === 'series') return '#/writings/series/' + rd.seriesIndex + '/' + rd.partIndex;
            if (rd.type === 'single') return '#/writings/single/' + rd.index;
          }
          return '#/' + r;
        };
        const parseHash = (h) => {
          const trimmed = h ? h.replace(/^#/, '') : '/home';
          const seg = trimmed.split('/').filter(Boolean);
          const rCand = seg[0];
          const r = (rCand==='home'||rCand==='reading'||rCand==='writings'||rCand==='about') ? rCand : 'home';
          if (r==='writings' && seg[1]==='series' && seg.length>=4) {
            const si = parseInt(seg[2],10); const pi = parseInt(seg[3],10);
            const s = content.series[si]; const p = s && s.parts[pi];
            if (s && p) return { route:'writings', reader:{ type:'series', series:s.title, seriesIndex:si, partIndex:pi, title:p.t, date:p.d, blurb:p.s } };
          }
          if (r==='writings' && seg[1]==='single' && seg.length>=3) {
            const idx = parseInt(seg[2],10); const p = content.singles[idx];
            if (p) return { route:'writings', reader:{ type:'single', index:idx, title:p.t, date:p.d, blurb:p.s } };
          }
          return { route:r, reader:null };
        };
        React.useEffect(()=>{
          const apply = ()=>{
            const st = parseHash(window.location.hash);
            setRoute(st.route);
            setReader(st.reader);
          };
          apply();
          const onHash = ()=> apply();
          window.addEventListener('hashchange', onHash);
          return ()=> window.removeEventListener('hashchange', onHash);
        }, []);
        React.useEffect(()=>{
          const next = buildHash(route, reader);
          if (window.location.hash !== next) window.location.hash = next;
        }, [route, reader]);

        const content = {
          series: [
            {
              title: "Reihe Geld",
              blurb: "does money matter, or do real goods drive outcomes?",
              parts: [
                { t: "Über die Makute", d: "2025-06-01", s: "Montesquieu, gedachte Einheiten, Fama, Modigliani–Miller." },
                { t: "Kann Free Banking funktionieren?", d: "2025-06-15", s: "Praktikabilität, Stabilität, Clearing." },
                { t: "Was ist Geld?", d: "2025-07-01", s: "Mehrere Linsen; Cochrane; wann sind Krypto-Assets Geld?" },
                { t: "Cryptowährungen", d: "2025-07-20", s: "Design, Geldähnlichkeit, Friktionen." }
              ]
            },
            {
              title: "Reihe Eigentum",
              blurb: "Eigentum als Fundament: Rechtfertigung, Grenzen, Enteignung.",
              parts: [
                { t: "Rechtfertigung und Ursprung", d: "2025-08-05", s: "Locke vs Hume; Naturrecht vs Konvention." },
                { t: "Grenzen, Enteignung, Ausschließbarkeit", d: "2025-08-19", s: "Temporale & Spezies-Ungerechtigkeiten; Trespassing." },
                { t: "Wem gehört der Mond?", d: "2025-09-02", s: "Anspruch, Durchsetzung, Legitimität in neuen Räumen." }
              ]
            }
          ],
          singles: [
            { t: "Langfristige Investition, Wachstum & Erhaltung", d: "2025-05-10", s: "Infrastruktur, Wartung, Kapitalstock." }
          ]
        };

        const openReader = (payload) => {
          if (payload && payload.type === "series") {
            const s = content.series[payload.seriesIndex];
            if (!s) return;
            const p = s.parts[payload.partIndex];
            if (!p) return;
            setReader({
              type: "series",
              series: s.title,
              seriesIndex: payload.seriesIndex,
              partIndex: payload.partIndex,
              title: p.t,
              date: p.d,
              blurb: p.s,
            });
            return;
          }
          if (payload && payload.type === "single") {
            const p = content.singles[payload.index];
            if (!p) return;
            setReader({ type: "single", index: payload.index, title: p.t, date: p.d, blurb: p.s });
            return;
          }
          if (payload && payload.title) {
            setReader(payload);
          }
        };

        const toggleTheme = () => {
          setTheme(t => {
            if (t === 'mint') return 'dark';
            if (t === 'dark') return 'light';
            return 'mint';
          });
        };

        const css = `
          html, body, #root { height: 100%; margin: 0; background:var(--bg); }
          :root { color-scheme: dark; }
          .theme-dark { --bg:#000; --text:#e5e5e5; --dim:#9ca3af; --border:#121212; --card-bg:#060606; --nav-bg: rgba(0,0,0,0.5); --footer-border:#0a0a0a; --slider-track:#0a0a0a; --slider-hover:#141414; --thumb-bg:#8a8a8a; --thumb-border:#1a1a1a; --toggle-active:#1a1a1a; --axis:#101010; --demand:#9e9e9e; --supply:#8f8f8f; --supply-tax:#8a9199; --wedge:#b98a1e; --grid:#1a1a1a; --point:#bdbdbd; --label:#9ca3af; --dwl-bg:#5c2f2f; --dwl-stroke:#c28a8a; --dwl-stroke-opacity:0.35; --dwl-bg-opacity:0.10; --chip-bg:#0a0a0a; --book-blur: blur(5px); --book-border: rgba(255,255,255,0.1); --book-title-color: rgba(210,190,160,0.65); --book-active-border: rgba(255,255,255,0.4); --book-shadow: inset 2px 0 4px rgba(255,255,255,0.04); --book-active-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 2px 0 4px rgba(255,255,255,0.15); }
          .theme-mint { --bg:#061a16; --text:#e5e5e5; --dim:#9dcab9; --border:#14352e; --card-bg:#0b221d; --nav-bg: rgba(6,26,22,0.55); --footer-border:#14352e; --slider-track:#13332b; --slider-hover:#184038; --thumb-bg:#a9e9d4; --thumb-border:#1f5a4e; --toggle-active:#163a33; --axis:#14352e; --demand:#aeead8; --supply:#7fd1b7; --supply-tax:#9dcab9; --wedge:#30d5b0; --grid:#1a1a3e36; --point:#cfeee4; --label:#9dcab9; --dwl-bg:#19473e; --dwl-stroke:#82d9c2; --dwl-stroke-opacity:0.30; --dwl-bg-opacity:0.12; --chip-bg:#102e28; --book-blur: blur(5px); --book-border: rgba(255,255,255,0.1); --book-title-color: rgba(210,190,160,0.65); --book-active-border: rgba(255,255,255,0.4); --book-shadow: inset 2px 0 4px rgba(255,255,255,0.04); --book-active-shadow: 0 10px 20px rgba(0,0,0,0.5), inset 2px 0 4px rgba(255,255,255,0.15); }
          .theme-light { --bg:#f4f1ea; --text:#2c2c2c; --dim:#827f79; --border:#e4dfd5; --card-bg:#fbf9f5; --nav-bg: rgba(244,241,234,0.65); --footer-border:#e4dfd5; --slider-track:#e4dfd5; --slider-hover:#d6d0c4; --thumb-bg:#fbf9f5; --thumb-border:#b8b2a5; --toggle-active:#e4dfd5; --axis:#d6d0c4; --demand:#6b8e7e; --supply:#5e7a8a; --supply-tax:#8a99a4; --wedge:#c89446; --grid:rgba(0,0,0,0.06); --point:#2c2c2c; --label:#827f79; --dwl-bg:#d9c5c5; --dwl-stroke:#b37d7d; --dwl-stroke-opacity:0.4; --dwl-bg-opacity:0.25; --chip-bg:#f4f1ea; --book-blur: none; --book-border: rgba(0,0,0,0.15); --book-title-color: rgba(0,0,0,0.6); --book-active-border: rgba(0,0,0,0.4); --book-shadow: inset 2px 0 4px rgba(0,0,0,0.08); --book-active-shadow: 0 10px 20px rgba(0,0,0,0.15), inset 2px 0 4px rgba(0,0,0,0.1); }
          
          .theme-light { color-scheme: light; }
          button { -webkit-appearance:none; appearance:none; border:0; background:transparent; color:inherit; font:inherit; }
          button:focus { outline:none; }
          a { color: inherit; }
          .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }
          .nav { position: sticky; top: 0; background: var(--nav-bg); backdrop-filter: saturate(1.1) blur(10px) contrast(0.95); border-bottom: 1px solid var(--footer-border); z-index: 10; }
          .nav-inner { height: 64px; display: flex; align-items: center; justify-content: space-between; }
          .title { font-weight: 700; letter-spacing: -0.02em; }
          .title.joel { position: relative; display: inline-flex; align-items: flex-end; gap: 0; color: var(--text); line-height: 1; letter-spacing: -0.02em; cursor:pointer; }
          .j-pad { display:inline-block; width:0.12em; }
          .logo { display:inline-flex; align-items:flex-end; margin-right:-0.30em; transform: translateY(0.20em); }
          .logo svg { height:1.05em; width:auto; display:block; overflow:visible; }
          .logo-oel { display:inline-block; margin-left:-0.26em; }
          .logo-dot { transition: transform .25s cubic-bezier(.2,.7,.2,1.2); transform-origin:center; }
          .title.joel:hover .logo-dot { transform: translateY(-15%); }
          .tabs { display: flex; gap: 16px; }
          .tab { padding: 8px 0; border: none; border-radius: 0; background: transparent; color: var(--dim); font-size: 13px; cursor: pointer; transition: color 0.2s; }
          .tab:hover { color: var(--text); }
          .tab.active { color: var(--text); }
          .main { padding-top: 28px; padding-bottom: 72px; }
          h1 { font-size: 52px; line-height: 1.05; margin: 0 0 12px 0; letter-spacing: -0.02em; }
          h2 { font-size: 28px; margin: 0 0 12px 0; }
          p { color: var(--text); }
          .dim { color: var(--dim); }
          .list { display: grid; gap: 12px; }
          .card { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; background: var(--card-bg); }
          .link { text-decoration: underline; text-underline-offset: 3px; }
          .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .02em }
          .slider { -webkit-appearance: none; appearance: none; height: 2px; width: 220px; background: var(--slider-track); border-radius: 2px; outline: none; }
          .slider:hover { background: var(--slider-hover); }
          .slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--thumb-bg); border: 1px solid var(--thumb-border); box-shadow: none; transition: background .2s, transform .1s; }
          .slider:hover::-webkit-slider-thumb { filter: brightness(1.1); }
          .slider:active::-webkit-slider-thumb { transform: scale(1.05); }
          .scroll-cue { display:flex; align-items:center; justify-content:center; gap:8px; color:var(--dim); font-size:12px; opacity:.85; margin: 18px 0 12px; }
          .chev { display:inline-block; }
          @keyframes bob { 0%{ transform: translateY(0);} 50%{ transform: translateY(4px);} 100%{ transform: translateY(0);} }
          .chev svg { animation: bob 1.8s ease-in-out infinite; }
          .reveal { opacity:0; transform: translateY(24px); transition: opacity 1.2s ease, transform 1.2s ease; transition-delay: .15s; }
          .reveal.visible { opacity:1; transform:none; }
          
          /* Bookshelf Layout & Viewport */
          .shelf-viewport {
            position: relative;
            width: 100vw; 
            max-width: 1100px; 
            left: 50%;
            transform: translateX(-50%); 
            display: flex;
            align-items: center;
            justify-content: center;
          }
          
          .shelf-wrapper { 
            width: calc(100% - 100px); 
            margin: 0 auto;
            padding: 40px 0 20px 0; 
            display: flex; 
            overflow-x: auto; 
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            scroll-behavior: smooth; 
            -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
            mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
            transform: translateZ(0); 
          }
          .shelf-wrapper::-webkit-scrollbar { display: none; width: 0; height: 0; }
          
          .shelf-nav-btn {
            position: absolute;
            top: calc(50% + 10px);
            transform: translateY(-50%);
            width: 36px; height: 36px;
            border-radius: 50%;
            background: rgba(120, 120, 120, 0.15);
            border: 1px solid rgba(120, 120, 120, 0.2);
            color: var(--text);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 100;
            opacity: 0.6; transition: opacity 0.2s, background 0.2s;
            backdrop-filter: blur(8px);
          }
          .shelf-nav-btn:hover {
            opacity: 1; background: rgba(120, 120, 120, 0.25);
          }
          .shelf-nav-btn.left { left: 0px; }
          .shelf-nav-btn.right { right: 0px; }

          .shelf-container { 
            display: flex; 
            align-items: flex-end; 
            gap: 2px; 
            padding: 0 64px; 
            min-width: max-content; 
            margin: 0 auto; 
          }
          
          .book { 
            border: 1px solid var(--book-border); 
            border-radius: 1px; 
            backdrop-filter: var(--book-blur); 
            -webkit-backdrop-filter: var(--book-blur); 
            transform-origin: bottom center; 
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.4s ease, border-color 0.4s ease, box-shadow 0.4s ease; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            box-shadow: var(--book-shadow); 
            transform: perspective(1000px) translateZ(0) rotateX(0deg); 
          }
          .book-title { 
            writing-mode: vertical-rl; 
            font-family: ui-sans-serif, system-ui, sans-serif; 
            font-size: 10px; 
            letter-spacing: 2px; 
            color: var(--book-title-color); 
            text-transform: uppercase; 
            pointer-events: none; 
          }
          .shelf-container:not(.has-active) .book:hover { 
            filter: brightness(1.2) saturate(1.1); 
            transform: perspective(1000px) translateZ(40px) rotateX(-8deg); 
          }

          .shelf-container.has-active .book:not(.active) {
            filter: brightness(0.4) saturate(0.5);
            transform: perspective(1000px) translateZ(-20px);
          }
          .shelf-container.has-active .book:hover:not(.active) {
            filter: brightness(0.7);
            transform: perspective(1000px) translateZ(0px) rotateX(-5deg);
          }
          .book.active {
            transform: perspective(1000px) translateZ(60px) translateY(10px) rotateX(-5deg);
            filter: brightness(1.3) saturate(1.1);
            z-index: 10;
            border-color: var(--book-active-border);
            box-shadow: var(--book-active-shadow);
          }

          .book-take-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
          }
          .book-take-panel.open {
            grid-template-rows: 1fr;
          }
          .book-take-inner {
            overflow: hidden;
            min-height: 0;
            padding: 0 16px;
          }
          .book-take-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            margin: 16px 0 32px 0;
            width: 100%;
            box-sizing: border-box;
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s;
          }
          .book-take-panel.open .book-take-content {
            opacity: 1;
            transform: translateY(0);
          }
        `;

        React.useEffect(() => {
          const items = [];
          content.series.forEach((s, si)=> s.parts.forEach((p, pi)=> items.push({kind:"series", seriesIndex:si, partIndex:pi, title:p.t, date:p.d})));
          content.singles.forEach((p,i)=> items.push({kind:"single", index:i, title:p.t, date:p.d}));
          const sorted = [...items].sort((a,b)=> +new Date(b.date) - +new Date(a.date));
          console.assert(sorted.every((it,idx)=> idx===0 || +new Date(sorted[idx-1].date) >= +new Date(it.date)), "items date-desc");
        }, [route]);

        return (
          <div className={`theme-${theme}`} style={{ minHeight: "100vh", background: "var(--bg)", color: "var(--text)", fontFamily: "ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Inter, sans-serif", transition: "background 0.3s, color 0.3s" }}>
            <style>{css}</style>

            <div className="nav">
              <div className="wrap nav-inner">
                <div
                  className="title joel"
                  aria-label="joel"
                  onClick={toggleTheme}
                  role="button"
                  tabIndex={0}
                  onKeyDown={(e)=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggleTheme(); }}}
                >
                  <span className="j-pad" aria-hidden="true">&nbsp;</span>
                  <span className="logo" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img" aria-label="j">
                      <circle className="logo-dot" cx="9.2" cy="1" r="2.1" fill="currentColor" />
                      <path d="M9.2 7.0 V14.2 Q8.4 18.8 6.8 18.8" fill="none" stroke="currentColor" strokeWidth="3.8" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </span><span className="logo-oel">oel</span>
                </div>
                <div className="tabs">
                  <button className={`tab ${route==='home'?'active':''}`} onClick={()=> setRoute('home')}>home</button>
                  <button className={`tab ${route==='reading'?'active':''}`} onClick={()=> setRoute('reading')}>reading</button>
                  <button className={`tab ${route==='writings'?'active':''}`} onClick={()=> setRoute('writings')}>writings</button>
                  <button className={`tab ${route==='about'?'active':''}`} onClick={()=> setRoute('about')}>about</button>
                </div>
              </div>
            </div>

            {route === 'home' && <Home />}
            {route === 'reading' && <Reading />}
            {route === 'writings' && (reader ? <ReaderView data={reader} content={content} onClose={()=>setReader(null)} onOpen={openReader} /> : <Writings onOpen={openReader} content={content} />)}
            {route === 'about' && <About />}

            <footer className="wrap" style={{ borderTop: '1px solid var(--footer-border)', color: 'var(--dim)', padding: '28px 0 96px', marginTop: 48, lineHeight: 1.5, fontSize: 12 }}>
              © {new Date().getFullYear()} joel — site is a work in progress :)
            </footer>
          </div>
        );
      }

      function Home(){
        const [visible, setVisible] = React.useState(false);
        const chartRef = React.useRef(null);

        React.useEffect(()=>{
          const el = chartRef.current;
          if (!el) return;
          const io = new IntersectionObserver((entries)=>{
            entries.forEach(e=>{ if(e.isIntersecting){ setVisible(true); }});
          }, { rootMargin: '0px 0px -10% 0px', threshold: 0.35 });
          io.observe(el);
          return ()=> io.disconnect();
        }, []);

        return (
          <>
            <main className="wrap main" style={{minHeight:'75vh'}}>
              <h1>hi.</h1>
              <p style={{ margin: '0 0 12px 0' }}>i'm joel.</p>
              <p style={{ margin: '0 0 2px 0' }}>i study law & economics (and a little philosophy).</p>
              <p style={{ margin: '0' }}>here, i explore ideas in different fields and share what interests me.</p>
              
              <p className="dim" style={{ margin: '56px 0 0 0' }}>you can find me on <a className="link" href="https://x.com/foenus" target="_blank" rel="noreferrer">x</a>.</p>
              
              <div style={{ marginTop: '56px' }}>
                <Note>note: this site is new. i'll keep adding to it in the future.</Note>
              </div>
              
              <div className="scroll-cue">
                <span className="chev" aria-hidden="true">
                  <svg width="16" height="16" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="var(--dim)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                </span>
              </div>
            </main>
            <div ref={chartRef} className={`reveal ${visible ? 'visible' : ''}`} style={{marginTop: 0}}>
              <LandTaxChartDemo />
            </div>
          </>
        );
      }

      function BookShelf() {
        const [activeIndex, setActiveIndex] = React.useState(null);
        const scrollRef = React.useRef(null);

        React.useEffect(() => {
          if (scrollRef.current) {
            scrollRef.current.scrollLeft = 200;
          }
        }, []);

        const handleScroll = (amount) => {
          if (scrollRef.current) {
            scrollRef.current.scrollBy({ left: amount, behavior: 'smooth' });
          }
        };

        const colorPalette = [
          "rgba(145, 65, 75, 0.8)",   // Dunkelrot, gedämpft
          "rgba(65, 115, 85, 0.8)",   // Dunkelgrün, gedämpft
          "rgba(110, 110, 110, 0.8)", // Echtes Grau
          "rgba(80, 80, 80, 0.8)",    // Echtes Dunkelgrau
          "rgba(125, 95, 70, 0.8)",   // Gedämpftes Braun
          "rgba(165, 105, 65, 0.8)",  // Rostorange
          "rgba(75, 100, 120, 0.8)"   // Graublau
        ];

        const baseData = [
          { title: "Fiction", author: "Autor A" },
          { title: "History", author: "Autor B" },
          { title: "Non-Fiction", author: "Autor C" },
          { title: "Crime", author: "Autor D" },
          { title: "Poetry", author: "Autor E" }
        ];

        const books = React.useMemo(() => {
          return Array.from({ length: 80 }).map((_, i) => {
            const base = baseData[i % 5];
            
            const colorIndex = Math.floor(Math.abs(Math.sin(i * 1.5)) * colorPalette.length);
            const color = colorPalette[colorIndex];
            
            const height = 190 + (Math.abs(Math.sin(i * 7.13)) * 60); 
            const width = 22 + (Math.abs(Math.cos(i * 3.14)) * 4); 

            return {
              ...base,
              color,
              height,
              width,
              take: `Gedanken und Notizen zu ${base.title}. Die inhaltliche Tiefe variiert, aber der analytische Ansatz im mittleren Segment ist bemerkenswert.`
            };
          });
        }, []);

        const activeBook = activeIndex !== null ? books[activeIndex] : null;

        return (

      function Writings({ onOpen, content }){
        const [openSeries, setOpenSeries] = React.useState({});
        const [showIndex, setShowIndex] = React.useState(false);
        const toggleSeries = (i) => setOpenSeries(prev => ({ ...prev, [i]: !prev[i] }));

        const { series, singles } = content;

        const allItems = React.useMemo(() => {
          const items = [];
          series.forEach((s, si) => {
            s.parts.forEach((p, pi) => {
              items.push({ kind:'series', seriesIndex: si, partIndex: pi, title: p.t, date: p.d });
            });
          });
          singles.forEach((p, i) => items.push({ kind:'single', index: i, title: p.t, date: p.d }));
          return items.sort((a,b)=> +new Date(b.date) - +new Date(a.date));
        }, [series, singles]);

        const Chevron = ({open}) => (
          <svg width="16" height="16" viewBox="0 0 24 24" style={{transform: open?'rotate(90deg)':'rotate(0deg)', transition:'transform .15s ease'}} aria-hidden="true"><path d="M8 5l8 7-8 7" fill="none" stroke="var(--supply-tax)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
        );

        const Stats = () => {
          const total = allItems.length;
          const last = allItems[0]?.date || '—';
          const byYear = allItems.reduce((acc,it)=>{ const y = (it.date||'').slice(0,4); acc[y]=(acc[y]||0)+1; return acc; },{});
          const currentYear = new Date().getFullYear().toString();
          return (
            <div style={{display:'flex',gap:12,alignItems:'baseline',flexWrap:'wrap'}}>
              <span className="mono dim" style={{fontSize:12}}>total: {total}</span>
              <span className="mono dim" style={{fontSize:12}}>{currentYear}: {byYear[currentYear] || 0}</span>
              <span className="mono dim" style={{fontSize:12}}>last: {last}</span>
            </div>
          );

        return (
          <main className="wrap main">
            <h2 style={{margin:0}}>writings</h2>
            <div style={{marginTop:8}}><Stats/></div>

            {!showIndex ? (
              <div className="list" style={{marginTop:12}}>
                <div className="card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontWeight:600}}>series</div>
                  </div>
                  <div className="list" style={{marginTop:8}}>
                    {series.map((s,i)=> (
                      <div key={i} style={{border:'1px solid var(--border)',borderRadius:10,background:'var(--card-bg)'}}>
                        <button onClick={()=>toggleSeries(i)} aria-expanded={!!openSeries[i]} style={{width:'100%',textAlign:'left',padding:'12px 12px',background:'transparent',border:'none',display:'flex',alignItems:'center',justifyContent:'space-between',cursor:'pointer'}}>
                          <div>
                            <div style={{fontWeight:600}}>{s.title}</div>
                            <div className="dim" style={{marginTop:4,fontSize:14}}>{s.blurb}</div>
                          </div>
                          <Chevron open={!!openSeries[i]} />
                        </button>
                        {openSeries[i] && (
                          <div className="list" style={{padding:'0 12px 12px 12px'}}>
                            {s.parts.map((p,j)=> (
                              <div key={j} style={{border:'1px solid var(--border)',borderRadius:8}}>
                                <button onClick={()=>onOpen({ type: 'series', seriesIndex: i, partIndex: j })} style={{width:'100%',textAlign:'left',padding:'10px 10px',background:'transparent',border:'none',display:'grid',gridTemplateColumns:'auto 1fr auto',columnGap:8,alignItems:'baseline',cursor:'pointer'}}>
                                  <span className="mono dim" style={{fontSize:12,width:20,textAlign:'right'}}>{j+1}.</span>
                                  <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.t}</span>
                                  <span className="mono dim" style={{fontSize:12}}>{p.d}</span>
                                </button>
                                <div className="dim" style={{padding:'0 10px 10px 38px',fontSize:12}}>{p.s}</div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                </div>

                <div className="card">
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'baseline'}}>
                    <div style={{fontWeight:600}}>single essays</div>
                  </div>
                  <div className="list" style={{marginTop:8}}>
                    {singles.map((p,i)=> (
                      <div key={i} style={{border:'1px solid var(--border)',borderRadius:8}}>
                        <button onClick={()=>onOpen({ type: 'single', index: i })} style={{width:'100%',textAlign:'left',padding:'10px 10px',background:'transparent',border:'none',display:'grid',gridTemplateColumns:'1fr auto',columnGap:8,alignItems:'baseline',cursor:'pointer'}}>
                          <span style={{overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.t}</span>
                          <span className="mono dim" style={{fontSize:12}}>{p.d}</span>
                        </button>
                        <div className="dim" style={{padding:'0 10px 10px 10px',fontSize:12}}>{p.s}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            ) : (
              <div className="card" style={{marginTop:12}}>
                <div style={{display:'grid',gridTemplateColumns:'100px 1fr auto',gap:'8px 12px',alignItems:'center'}}>
                  <div className="mono dim" style={{fontSize:12}}>date</div>
                  <div className="mono dim" style={{fontSize:12}}>title</div>
                  <div className="mono dim" style={{fontSize:12,textAlign:'right'}}>type</div>
                  {allItems.map((it,idx)=> (
                    <React.Fragment key={idx}>
                      <div className="mono dim" style={{fontSize:12}}>{it.date}</div>
                      <button onClick={()=> onOpen(it.kind==='series' ? { type:'series', seriesIndex: it.seriesIndex, partIndex: it.partIndex } : { type:'single', index: it.index })} style={{textAlign:'left',background:'transparent',border:'none',padding:'6px 0',cursor:'pointer',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{it.title}</button>
                      <div className="mono dim" style={{fontSize:12,textAlign:'right'}}>{it.kind==='series' ? 'series' : 'single'}</div>
                    </React.Fragment>
                  ))}
                </div>
              </div>
            )}

            <div style={{display:'flex',justifyContent:'flex-end',marginTop:16}}>
              <div style={{display:'inline-flex',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                <button onClick={()=>setShowIndex(false)} className="mono" style={{fontSize:12,padding:'6px 10px',background: showIndex ? 'transparent' : 'var(--toggle-active)',color:'var(--text)',cursor:'pointer'}}>series</button>
                <button onClick={()=>setShowIndex(true)} className="mono" style={{fontSize:12,padding:'6px 10px',background: showIndex ? 'var(--toggle-active)' : 'transparent',color:'var(--text)',cursor:'pointer'}}>index</button>
              </div>
            </div>
          </main>
        );
      }

      function ReaderView({ data, content, onOpen, onClose }){
        React.useEffect(()=>{
          const onKey = (e)=>{ if(e.key==='Escape'){ onClose(); }};
          window.addEventListener('keydown', onKey);
          return ()=> window.removeEventListener('keydown', onKey);
        }, [onClose]);

        const nextInfo = React.useMemo(()=>{
          if (data && data.type==='series'){
            const s = content.series[data.seriesIndex];
            if (!s) return null;
            const nextIdx = data.partIndex + 1;
            if (nextIdx < s.parts.length){
              const p = s.parts[nextIdx];
              return { title: p.t, index: nextIdx };
            }
          }
          return null;
        }, [data, content]);

        const goNext = ()=>{
          if (!nextInfo) return;
          onOpen({ type:'series', seriesIndex: data.seriesIndex, partIndex: data.partIndex + 1 });
        };

        return (
          <main className="wrap main">
            <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:12}}>
              <button onClick={onClose} className="mono" style={{fontSize:12,padding:'6px 10px',border:'1px solid var(--border)',borderRadius:8,background:'transparent',color:'var(--text)',cursor:'pointer'}}>← back</button>
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <span className="mono dim" style={{fontSize:12}}>{data.series ? data.series : 'essay'}</span>
                {nextInfo && (
                  <button onClick={goNext} className="mono" style={{fontSize:12,padding:'6px 10px',border:'1px solid var(--border)',borderRadius:8,background:'transparent',color:'var(--text)',cursor:'pointer'}}>next →</button>
                )}
              </div>
            </div>
            <h2 style={{fontSize:34, letterSpacing:'-0.01em', marginTop:12}}>{data.title}</h2>
            <div className="mono dim" style={{fontSize:12, marginTop:4}}>{data.date}</div>
            <article style={{maxWidth:'72ch', marginTop:16, fontSize:18, lineHeight:1.7, color:'var(--text)'}}>
              <p className="dim">{data.blurb}</p>
              <p>[draft placeholder] add content here.</p>
            </article>
          </main>
        );
      }

      function LandTaxChartDemo(){
        const [tax, setTax] = React.useState(20);
        const [regime, setRegime] = React.useState('lvt');
        const width = 780, height = 420, pad = 48;
        const a = 100, b = 0.6;
        const Qs = 60;
        const Pb_lvt = a - b*Qs;
        const Ps_lvt = Math.max(0, Pb_lvt - tax);
        const rev_lvt = tax * Qs;
        const c = 10, m = 0.6;
        const Q0 = (a - c) / (b + m);
        const P0 = c + m*Q0;
        const Q1 = Math.max(0, (a - (c + tax)) / (b + m));
        const Pb1 = a - b*Q1;
        const Ps1 = Pb1 - tax;
        const rev_prop = tax * Q1;
        const dwl_val = 0.5 * tax * Math.max(0, (Q0 - Q1));
        const x = (q)=> pad + (q/100)*(width-2*pad);
        const y = (p)=> height - pad - (p/100)*(height-2*pad);

        React.useEffect(()=>{
          if (regime === 'lvt') {
            console.assert(Qs === 60, 'Qs fixed under LVT');
            console.assert(Math.abs(Pb_lvt - (a - b*Qs)) < 1e-9, 'Pb_lvt = a - b*Qs');
            console.assert(Math.abs((Ps_lvt + tax) - Pb_lvt) < 1e-9, 'wedge = tax');
            console.assert(Math.abs(rev_lvt - tax*Qs) < 1e-9, 'rev LVT = t*Q');
          } else {
            console.assert(Q1 <= Q0 + 1e-9, 'Q falls with property tax');
            console.assert(Math.abs((Pb1 - Ps1) - tax) < 1e-9, 'wedge = tax');
            console.assert(Math.abs(rev_prop - tax*Q1) < 1e-9, 'rev prop = t*Q1');
            console.assert(dwl_val >= -1e-9, 'DWL non-negative');
            const Q1next = Math.max(0, (a - (c + (tax+2))) / (b + m));
            console.assert(Q1next <= Q1 + 1e-9, 'Q should decrease as tax increases');
          }
        }, [tax, regime]);

        return (
          <main className="wrap main">
            <h2>tax regimes in econ 101</h2>
            <p className="dim">lvt: fixed land; no dwl. property tax: q falls; dwl hatched.</p>
            <div style={{overflow:'visible'}}>
              <svg width={width} height={height} role="img" aria-label="Tax comparison" style={{display:'block',width:'100%',height:'auto'}}>
                <defs>
                  <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="strokeWidth">
                    <path d="M0,0 L8,4 L0,8 z" fill="var(--label)" />
                  </marker>
                  <pattern id="dwlHatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(20)">
                    <rect width="6" height="6" fill="var(--dwl-bg)" opacity="var(--dwl-bg-opacity)" />
                    <line x1="0" y1="0" x2="0" y2="6" stroke="var(--dwl-stroke)" strokeWidth="1" opacity="var(--dwl-stroke-opacity)" />
                  </pattern>
                </defs>
                <line x1={pad} y1={y(0)} x2={pad} y2={y(100)} stroke="var(--axis)" />
                <line x1={x(0)} y1={height-pad} x2={x(100)} y2={height-pad} stroke="var(--axis)" />
                <text x={pad-10} y={y(100)-8} fill="var(--label)" fontSize="10" textAnchor="end">P</text>
                <text x={x(100)+6} y={height-pad+14} fill="var(--label)" fontSize="10">Q</text>

                {regime === 'lvt' ? (
                  <g>
                    <rect x={x(0)} y={y(Pb_lvt)} width={x(Qs)-x(0)-2} height={y(Ps_lvt)-y(Pb_lvt)} fill="var(--wedge)" opacity="0.10" />
                    <line x1={x(0)} y1={y(a)} x2={x(100)} y2={y(a - b*100)} stroke="var(--demand)" strokeWidth="1.6" markerEnd="url(#arrow)" />
                    <text x={x(8)} y={y(a) - 8} fill="var(--label)" fontSize="10">demand</text>
                    <line x1={x(Qs)} y1={y(0)} x2={x(Qs)} y2={y(100)} stroke="var(--supply)" strokeWidth="1.6" />
                    <text x={x(Qs)+6} y={y(92)} fill="var(--label)" fontSize="10">supply (fixed)</text>
                    <circle cx={x(Qs)} cy={y(Pb_lvt)} r="3" fill="var(--point)" />
                    <line x1={x(Qs)} y1={y(Ps_lvt)} x2={x(Qs)} y2={y(Pb_lvt)} stroke="var(--wedge)" strokeWidth="4" opacity="0.45" />
                    <text x={pad+10} y={y((Pb_lvt+Ps_lvt)/2)+3} fill="var(--label)" fontSize="10">tax = {tax}</text>
                    <line x1={x(0)} y1={y(Pb_lvt)} x2={x(Qs)} y2={y(Pb_lvt)} stroke="var(--grid)" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Pb_lvt)+3} fill="var(--label)" fontSize="10" textAnchor="end">P_b</text>
                    <line x1={x(0)} y1={y(Ps_lvt)} x2={x(Qs)} y2={y(Ps_lvt)} stroke="var(--grid)" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Ps_lvt)+3} fill="var(--label)" fontSize="10" textAnchor="end">P_s</text>
                    <text x={x(Qs)} y={height-pad+18} fill="var(--label)" fontSize="10" textAnchor="middle">Q★</text>
                  </g>
                ) : (
                  <g>
                    <polygon points={`${x(Q1)},${y(Pb1)} ${x(Q1)},${y(c + m*Q1)} ${x(Q0)},${y(P0)}`} fill="url(#dwlHatch)" stroke="var(--dwl-stroke)" strokeOpacity="var(--dwl-stroke-opacity)" strokeWidth="1" />
                    <rect x={x(0)} y={y(Pb1)} width={x(Q1)-x(0)-2} height={y(Ps1)-y(Pb1)} fill="var(--wedge)" opacity="0.10" />
                    <line x1={x(0)} y1={y(a)} x2={x(100)} y2={y(a - b*100)} stroke="var(--demand)" strokeWidth="1.6" markerEnd="url(#arrow)" />
                    <text x={x(8)} y={y(a) - 8} fill="var(--label)" fontSize="10">demand</text>
                    <line x1={x(0)} y1={y(c)} x2={x(100)} y2={y(c + m*100)} stroke="var(--supply)" strokeWidth="1.6" />
                    <text x={x(6)} y={y(c)+12} fill="var(--label)" fontSize="10">supply</text>
                    <line x1={x(0)} y1={y(c+tax)} x2={x(100)} y2={y(c + tax + m*100)} stroke="var(--supply-tax)" strokeWidth="1.2" strokeDasharray="6 4" />
                    <text x={x(18)} y={y(c+tax)+12} fill="var(--label)" fontSize="10">supply + tax</text>
                    <circle cx={x(Q0)} cy={y(P0)} r="3" fill="var(--point)" />
                    <circle cx={x(Q1)} cy={y(Pb1)} r="3" fill="var(--point)" />
                    <line x1={x(Q1)} y1={y(Ps1)} x2={x(Q1)} y2={y(Pb1)} stroke="var(--wedge)" strokeWidth="4" opacity="0.45" />
                    <line x1={x(0)} y1={y(Pb1)} x2={x(Q1)} y2={y(Pb1)} stroke="var(--grid)" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Pb1)+3} fill="var(--label)" fontSize="10" textAnchor="end">P_b</text>
                    <line x1={x(0)} y1={y(Ps1)} x2={x(Q1)} y2={y(Ps1)} stroke="var(--grid)" strokeDasharray="4 4" opacity="0.6" />
                    <text x={pad-10} y={y(Ps1)+3} fill="var(--label)" fontSize="10" textAnchor="end">P_s</text>
                    <text x={(x(Q1)+x(Q1)+x(Q0))/3} y={(y(Pb1)+y(c+m*Q1)+y(P0))/3} fill="var(--dwl-stroke)" fontSize="10" className="mono">DWL</text>
                    <text x={pad+10} y={y((Pb1+Ps1)/2)+3} fill="var(--label)" fontSize="10">tax = {tax}</text>
                    <text x={x(Q1)} y={height-pad+18} fill="var(--label)" fontSize="10" textAnchor="middle">Q_t</text>
                    <text x={x(Q0)} y={height-pad+18} fill="var(--label)" fontSize="10" textAnchor="middle">Q₀</text>
                  </g>
                )}
              </svg>
              <div style={{display:'flex',alignItems:'center',gap:12,marginTop:12,flexWrap:'wrap'}}>
                <div style={{display:'inline-flex',border:'1px solid var(--border)',borderRadius:10,overflow:'hidden'}}>
                  <button onClick={()=>setRegime('lvt')} className="mono" style={{fontSize:12,padding:'6px 10px',background: regime==='lvt'? 'var(--toggle-active)': 'transparent',color:'var(--text)',cursor:'pointer'}}>LVT</button>
                  <button onClick={()=>setRegime('prop')} className="mono" style={{fontSize:12,padding:'6px 10px',background: regime==='prop'? 'var(--toggle-active)' : 'transparent',color:'var(--text)',cursor:'pointer'}}>property tax</button>
                </div>
                <span className="mono dim" style={{fontSize:12}}>tax</span>
                <input className="slider" type="range" min="0" max="40" step="2" value={tax} onChange={e=> setTax(parseInt(e.target.value,10))} />
                <span className="mono" style={{opacity:.85}}>{tax}</span>
                {regime==='lvt' ? (
                  <span className="mono dim" style={{fontSize:12}}>· revenue = {Math.round(rev_lvt)}</span>
                ) : (
                  <span className="mono dim" style={{fontSize:12}}>· revenue = {Math.round(rev_prop)} · DWL ≈ {Math.round(dwl_val)}</span>
                )}
                <span className="dim" style={{marginLeft:'auto',fontSize:12}}>{regime==='lvt'?'quantity unchanged; incidence on landowners':'quantity falls; DWL from distorted margin'}</span>
              </div>
            </div>
          </main>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
